name: Format audit files

on:
  push:
    branches:
      - audit/checkout-security-2026-09

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/checkout-security-2026-09
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format audit files
        run: |
          bunx prettier --write             src/components/DeliveryMapPicker.tsx             src/lib/checkout.ts             src/lib/delivery-geofence.ts             src/lib/delivery-map.test.ts             src/lib/delivery-policy.test.ts             src/lib/delivery-policy.ts             src/lib/delivery.ts             src/lib/waze.ts             src/routes/admin.area-entrega.tsx             src/routes/admin.enderecos.tsx             src/routes/admin.tsx             src/routes/checkout.tsx             src/routes/enderecos.tsx             src/routes/entregador.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Format audited delivery files"
          git push origin HEAD:audit/checkout-security-2026-09
